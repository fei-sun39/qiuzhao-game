<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="抽一个学历、学校、专业，在 12 周秋招里投简历、过笔试、答面试题。">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>秋招求生记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 一张"求职登记表"——冷灰蓝办公用纸 + 藏青墨水 + 印泥红公章；桌面双栏（岗位 | 投递），手机单栏，底部固定"结束本周" */
:root{
  --paper:#e9edf2; --sheet:#fbfcfd; --ink:#1c2938; --muted:#5b6878; --rule:#c8d1db; --soft:#f1f4f7;
  --accent:#24507d; --accent-ink:#ffffff; --stamp:#c42f2a; --ok:#2c7a4b; --warn:#a86a12;
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-stamp:"Ma Shan Zheng","Kaiti SC","STKaiti",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10161e; --sheet:#18212c; --ink:#e2e8ef; --muted:#93a1b2; --rule:#2c3846; --soft:#1f2935;
  --accent:#7fb0e0; --accent-ink:#0d1620; --stamp:#f0605a; --ok:#5fbf86; --warn:#e2a64a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10161e; --sheet:#18212c; --ink:#e2e8ef; --muted:#93a1b2; --rule:#2c3846; --soft:#1f2935;
  --accent:#7fb0e0; --accent-ink:#0d1620; --stamp:#f0605a; --ok:#5fbf86; --warn:#e2a64a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}

.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:clamp(28px,5vw,40px);letter-spacing:.04em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:.12em;margin-top:6px}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:4px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:not(:disabled):hover{filter:brightness(1.08)}

/* 登记表 */
.form{max-width:640px;width:100%;margin:0 auto;position:relative;overflow:hidden}
.form-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--ink)}
.form-title{font-family:var(--f-display);font-size:22px;letter-spacing:.1em}
.frow{display:grid;grid-template-columns:96px 1fr;border-bottom:1px solid var(--rule)}
.frow label{padding:12px 14px;background:var(--soft);border-right:1px solid var(--rule);font-size:13px;color:var(--muted);letter-spacing:.2em;display:flex;align-items:center}
.frow .cell{padding:10px 14px;font-size:20px;font-weight:700;min-height:52px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.frow .cell .sub{font-size:13px;font-weight:400;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:3px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.red{border-color:var(--stamp);color:var(--stamp)}
.chip.green{border-color:var(--ok);color:var(--ok)}
.chip.amber{border-color:var(--warn);color:var(--warn)}
.chip.blue{border-color:var(--accent);color:var(--accent)}
.form-foot{padding:16px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.howto{max-width:640px;margin:0 auto;color:var(--muted);font-size:14px;display:grid;gap:6px}
.howto b{color:var(--ink)}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.path span{padding:1px 8px;border:1px dashed var(--rule);border-radius:3px}

.stamp{font-family:var(--f-stamp);color:var(--stamp);border:3px double currentColor;border-radius:6px;padding:0 10px;display:inline-block;transform:rotate(-7deg);line-height:1.4;letter-spacing:.06em;white-space:nowrap}
.stamp.green{color:var(--ok)} .stamp.amber{color:var(--warn)} .stamp.grey{color:var(--muted)}
.stamp.in{animation:stampIn .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampIn{from{transform:rotate(-7deg) scale(1.8);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.form .seal{position:absolute;right:18px;top:70px;font-size:26px;opacity:.9}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.meter{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.meter .lab{display:flex;justify-content:space-between}
.meter .lab b{color:var(--ink);font-family:var(--f-mono)}
.bar{height:6px;background:var(--soft);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.san i{background:var(--ok)} .bar.san.low i{background:var(--stamp)} .bar.san.mid i{background:var(--warn)}

/* 游戏主界面 */
.top{display:grid;grid-template-columns:1fr auto;gap:10px 18px;padding:14px 18px;align-items:center}
.who{font-size:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.who b{font-size:18px}
.week{text-align:right}
.week .big{font-size:20px;font-weight:700}
.prog{height:4px;background:var(--soft);margin-top:6px;border-radius:2px;overflow:hidden;width:180px;margin-left:auto}
.prog i{display:block;height:100%;background:var(--stamp)}
.energy{display:flex;gap:4px;align-items:center}
.energy i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--accent);display:inline-block}
.energy i.on{background:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--rule)}
.act{border:1px solid var(--rule);background:var(--soft);padding:7px 12px;border-radius:4px;text-align:left;display:grid;line-height:1.35}
.act b{font-size:14px} .act span{font-size:11.5px;color:var(--muted)}
.act:not(:disabled):hover{border-color:var(--accent)}

.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{display:flex;flex-direction:column}
.panel>h2{font-family:var(--f-display);font-size:20px;font-weight:400;padding:12px 16px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel>h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.job{padding:12px 16px;border-bottom:1px solid var(--rule);display:grid;gap:6px}
.job:last-child{border-bottom:0}
.job .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.job .co{font-weight:700}
.job .role{color:var(--muted);font-size:14px}
.job .sal{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.job .tags{display:flex;gap:5px;flex-wrap:wrap;font-size:12px}
.job .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.job .ft .muted{font-size:12px}
.job .btns{display:flex;gap:6px}
.empty{padding:24px 16px;color:var(--muted);font-size:14px}

.appi{padding:10px 16px;border-bottom:1px solid var(--rule);display:grid;gap:5px;position:relative}
.appi:last-child{border-bottom:0}
.appi .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.appi .nm{font-weight:500;font-size:14px;min-width:0}
.appi .nm small{color:var(--muted);font-weight:400}
.pipe{display:flex;flex-wrap:wrap;gap:3px;font-size:11.5px}
.pipe span{padding:0 6px;border-radius:2px;background:var(--soft);color:var(--muted);border:1px solid transparent}
.pipe span.done{color:var(--ok);border-color:var(--ok);background:transparent}
.pipe span.cur{color:var(--accent);border-color:var(--accent);font-weight:700;background:transparent}
.pipe span.fail{color:var(--stamp);border-color:var(--stamp);background:transparent;text-decoration:line-through}
.appi .note{font-size:12px;color:var(--muted)}
.appi.dead{opacity:.62}
.appi .stamp{font-size:16px}
.fold{padding:8px 16px;font-size:13px;border:0;background:none;color:var(--accent);text-align:left}

.log{padding:12px 16px;display:grid;gap:4px;font-size:13px;max-height:220px;overflow:auto}
.log div{display:grid;grid-template-columns:52px 1fr;gap:8px}
.log .w{font-family:var(--f-mono);color:var(--muted)}
.good{color:var(--ok)} .bad{color:var(--stamp)} .warn{color:var(--warn)}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:2px solid var(--ink);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.dock .in{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .btn{padding:10px 22px;font-size:16px}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{width:100%;max-width:560px;max-height:100%;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.dialog .dh{padding:14px 18px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dialog .dh h3{font-family:var(--f-display);font-weight:400;font-size:20px}
.dialog .db{padding:16px 18px;display:grid;gap:12px}
.q{font-size:17px;font-weight:500}
.q .who2{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.1em;margin-bottom:4px}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--rule);background:var(--soft);text-align:left;padding:10px 12px;border-radius:4px;font-size:14.5px}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt.picked{border-color:var(--accent);background:transparent;font-weight:500}
.fb{padding:10px 12px;border-left:3px solid var(--muted);background:var(--soft);font-size:14px}
.fb.good{border-color:var(--ok)} .fb.bad{border-color:var(--stamp)}
.rep{display:grid;gap:6px;font-size:14px}
.rep div{padding-left:14px;position:relative}
.rep div::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.rep .good::before{background:var(--ok)} .rep .bad::before{background:var(--stamp)} .rep .warn::before{background:var(--warn)}
.evt{padding:10px 12px;border:1px dashed var(--rule);font-size:14px}
.evt b{display:block;font-size:12px;color:var(--muted);letter-spacing:.15em;font-weight:500}
.df{padding:12px 18px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:8px}

/* 结局 */
.ending{max-width:640px;width:100%;margin:0 auto;padding:22px 20px;display:grid;gap:14px;position:relative}
.ending .stamp{font-size:34px;justify-self:start}
.ending h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,34px)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule)}
.tally div{padding:8px 10px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:grid}
.tally div:nth-child(3n){border-right:0}
.tally div:nth-last-child(-n+3){border-bottom:0}
.tally span{font-size:12px;color:var(--muted)} .tally b{font-family:var(--f-mono);font-size:20px}
.share{background:var(--soft);border:1px solid var(--rule);padding:12px;font-size:14px;user-select:all;white-space:pre-wrap}
.offerlist{display:grid;gap:8px}
.offerrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule);flex-wrap:wrap}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:760px){
  .cols{grid-template-columns:1fr}
  .top{grid-template-columns:1fr}
  .week{text-align:left}.prog{margin-left:0}
  .frow{grid-template-columns:72px 1fr}
  .frow label{letter-spacing:.05em}
  .frow .cell{font-size:17px}
  .form .seal{top:auto;bottom:70px;right:12px;font-size:20px}
  .tally{grid-template-columns:repeat(2,1fr)}
  .tally div:nth-child(3n){border-right:1px solid var(--rule)}
  .tally div:nth-child(2n){border-right:0}
  .tally div:nth-last-child(-n+3){border-bottom:1px solid var(--rule)}
  .tally div:nth-last-child(-n+2){border-bottom:0}
}
@media (prefers-reduced-motion:reduce){.stamp.in{animation:none}}
</style>
</head>

<div class="overlay" id="ov" hidden><div class="dialog sheet" role="dialog" aria-modal="true" id="dlg"></div></div>

<script>
/* ========== 工具 ========== */
const $=s=>document.querySelector(s);
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), sig=x=>1/(1+Math.exp(-x));
const wpick=a=>{let t=a.reduce((s,x)=>s+x.w,0),r=R()*t;for(const x of a){if((r-=x.w)<0)return x}return a[a.length-1]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TOTAL_WEEKS=12, GOV_DEADLINE=7;

/* ========== 身份数据 ========== */
const DEGS=[{k:'本科',w:50,r:0},{k:'硕士',w:38,r:1},{k:'博士',w:12,r:2}];
const TIERS=[
 {k:'顶尖名校',halo:95,w:6,names:['清华大学','北京大学','复旦大学','上海交通大学','浙江大学','中国科学技术大学','南京大学']},
 {k:'985',halo:82,w:14,names:['武汉大学','华中科技大学','中山大学','哈尔滨工业大学','西安交通大学','四川大学','同济大学','南开大学','厦门大学','东南大学','山东大学','吉林大学']},
 {k:'211',halo:67,w:20,names:['北京邮电大学','西安电子科技大学','上海财经大学','中央财经大学','苏州大学','郑州大学','南京航空航天大学','暨南大学','华中农业大学','西南大学','云南大学']},
 {k:'双非一本',halo:52,w:28,names:['深圳大学','杭州电子科技大学','南京邮电大学','上海理工大学','浙江工业大学','燕山大学','山东科技大学','广东工业大学']},
 {k:'普通二本',halo:36,w:22,names:['某省属财经学院','某地方理工学院','某市属师范学院','某民办城市学院','某省属工程学院']},
 {k:'海归',halo:66,w:12,names:['伦敦某G5大学','新加坡国立大学','香港大学','美国某藤校（一年制）','悉尼大学','英国某罗素集团大学'],onlyDeg:1}
];
const MAJORS=[
 ['计算机科学与技术','cs'],['人工智能','cs'],['软件工程','cs'],['电子信息工程','ee'],['电气工程及其自动化','ee'],
 ['金融学','fin'],['会计学','fin'],['统计学','math'],['数学与应用数学','math'],['法学','law'],
 ['生物科学','bio'],['生物医学工程','bio'],['应用化学','chem'],['环境工程','chem'],['材料科学与工程','mat'],
 ['土木工程','civil'],['机械设计制造及其自动化','mech'],['汉语言文学','lit'],['新闻传播学','lit'],['英语','lit'],
 ['应用心理学','psy'],['工商管理','biz'],['市场营销','biz']
].map(([n,t])=>({n,t}));
const PIT=new Set(['bio','chem','mat','civil']);
const MAJ_LABEL={cs:'计算机',ee:'电子电气',fin:'金融财会',math:'数学统计',law:'法学',bio:'生物',chem:'化学化工',mat:'材料',civil:'土木',mech:'机械',lit:'文学传媒',psy:'心理',biz:'经管',any:'不限专业'};
const TRAITS=[
 {k:'社牛',d:'面试表达 +15',a:s=>{s.speak+=15}},
 {k:'卷王',d:'专业能力 +12，心态 −10',a:s=>{s.skill+=12;s.san-=10}},
 {k:'佛系',d:'心态 +20',a:s=>{s.san+=20}},
 {k:'表姐在大厂当HR',d:'开局送 2 个内推码',a:s=>{s.refs+=2}},
 {k:'绩点年级第一',d:'专业能力 +8，简历分 +4',a:s=>{s.skill+=8;s.rb+=4}},
 {k:'实习达人',d:'实习经历 +20',a:s=>{s.intern+=20}},
 {k:'导师放养',d:'每周精力 +1',a:s=>{s.maxE+=1},deg:[1,2]},
 {k:'课少',d:'每周精力 +1',a:s=>{s.maxE+=1},deg:[0]},
 {k:'玻璃心',d:'心态 −15，面试表达 +8',a:s=>{s.san-=15;s.speak+=8}},
 {k:'锦鲤体质',d:'所有判定概率 +5%',a:s=>{s.luck=.05}},
 {k:'社恐',d:'面试表达 −10，专业能力 +10',a:s=>{s.speak-=10;s.skill+=10}},
 {k:'有一篇一作论文',d:'专业能力 +10，研究类岗位简历分 +8',a:s=>{s.skill+=10;s.paper=1},deg:[1,2]}
];

/* ========== 岗位数据 ========== */
const CAT={bigtech:'互联网/科技',foreign:'外企',soe:'央国企',bank:'银行',finance:'金融',gov:'考公',edu:'教师',academic:'科研',startup:'初创',consult:'咨询',other:'其他'};
const J=(c,co,r,m,d,bar,s,k,x={})=>({c,co,r,m,d,bar,s,k,...x});
const JOBS=[
 J('bigtech','某头部短视频大厂','后端开发工程师',['cs','ee','math'],0,58,[32,48],'tech'),
 J('bigtech','某电商巨头','算法工程师',['cs','math','ee'],1,66,[40,60],'tech'),
 J('bigtech','某社交游戏大厂','游戏策划',['any'],0,60,[25,35],'general'),
 J('bigtech','某本地生活大厂','产品经理',['any'],0,60,[25,34],'general'),
 J('bigtech','某搜索引擎公司','数据分析师',['cs','math','fin'],0,52,[24,32],'tech'),
 J('bigtech','某新能源车企','嵌入式软件工程师',['ee','cs','mech'],0,46,[22,30],'tech'),

 {t:'一家没投过的公司打来电话："同学，考虑一下我们的销售岗吗？"心态 +3。',f:s=>{s.st.san+=3},tone:'warn'},
 {t:'朋友帮你做了一次模拟面试，说你语速太快。面试表达 +5。',f:s=>{s.st.speak+=5},tone:'good'},

];

/* ========== 状态 ========== */
let S={phase:'roll',id:null,rerolls:2};
let busy=false, rolling=false, showDead=false;

function rollIdentity(){
  const deg=wpick(DEGS);
  const tiers=TIERS.filter(t=>(t.onlyDeg===undefined||t.onlyDeg===deg.r)&&!(deg.r===2&&t.k==='普通二本'));
  const tier=wpick(tiers);
  const traits=TRAITS.filter(t=>!t.deg||t.deg.includes(deg.r));
  return {deg,tier:{k:tier.k,halo:tier.halo},school:pick(tier.names),major:pick(MAJORS),trait:pick(traits)};
}
function initStats(id){
  const s={skill:ri(28,46)+[0,8,15][id.deg.r]+Math.round((id.tier.halo-50)*.15)+(id.major.t==='cs'?3:0),
    speak:ri(25,55),intern:ri(0,30)+[0,10,5][id.deg.r],san:ri(68,80),maxE:5,refs:0,luck:0,rb:0,buff:0,pen:0,paper:0};
  TRAITS.find(t=>t.k===id.trait.k).a(s);
  norm(s); return s;
}
function norm(s){for(const k of ['skill','speak','intern'])s[k]=clamp(Math.round(s[k]),0,100);s.san=clamp(Math.round(s.san),-50,100)}
function startGame(sameStats){
  const st=sameStats&&S.init?JSON.parse(JSON.stringify(S.init)):initStats(S.id);
  S={phase:'play',id:S.id,rerolls:S.rerolls,init:JSON.parse(JSON.stringify(st)),st,week:1,energy:st.maxE,board:[],apps:[],applied:[],log:[],
     cnt:{apply:0,resume:0,written:0,inter:0,pool:0,offer:0},used:{},uid:1,signed:null,dead:false};
  newBoard();
  addLog(`秋招开始。你是${S.id.school}${S.id.major.n}专业的${S.id.deg.k}应届生。`,'');
  render();
}

/* ========== 判定 ========== */
const DEGNAME=['本科','硕士','博士'];
function fitOf(job){const t=S.id.major.t;if(job.m.includes(t))return 10;if(job.m.includes('any'))return 0;return -28}
function gate(job){
  if(S.id.deg.r<job.d)return `要求${DEGNAME[job.d]}及以上`;
  if(job.minHalo&&S.id.tier.halo<job.minHalo)return '限定重点院校';
  return '';
}
function resumeP(job,ref){
  if(gate(job))return .02;
  const s=S.st,h=S.id.tier.halo;
  let sc=.5*h+.25*s.intern+.15*s.skill+[0,8,10][S.id.deg.r]+s.rb+fitOf(job)+(ref?12:0);
  if(S.id.deg.r===2&&job.d===0&&job.k!=='research')sc-=6;
  if(job.k==='research'&&s.paper)sc+=8;
  return clamp(sig((sc-job.bar-6)/6)+s.luck,.03,.92);
}
function pLabel(p){return p>=.7?['高','green']:p>=.4?['中','blue']:p>=.15?['低','amber']:['渺茫','red']}
function stageOutcome(a,type,delta){
  const s=S.st,h=S.id.tier.halo,job=a.job,eb=Math.max(job.bar,40);let p;
  if(type==='resume')p=resumeP(job,a.ref);
  else if(type==='written'){const sc=.7*s.skill+.12*h+(R()*24-12);p=.85*sig((sc-eb*.85-6)/6)}
  else if(type==='hr')p=.72+delta*.014;
  else if(type==='check')p=.95;
  else{const sc=.45*s.speak+.3*s.skill+.08*h+delta+s.buff+(R()*16-8);p=.82*sig((sc-eb*.88-6)/5)}
  p=clamp(p+(type==='resume'?0:s.luck),.02,.97);
  return R()<p;
}
const FAIL={
 resume:['感谢您的投递，您的经历与岗位暂不匹配。','简历状态：已查看 → 不合适。','系统自动回复："流程已结束。"'],
 written:['笔试没过。编程题 AC 了半道。','行测时间不够，资料分析全靠蒙。','笔试没过，题目和刷过的一道都没对上。'],
 inter:['面试没过，感谢信很客气。','面试官说"回去等通知"，然后就没有通知了。','流程变灰：已结束。'],
 check:['体检复查没过，流程终止。']
};

/* ========== 招聘板 ========== */
function newBoard(){
  const avail=JOBS.filter(j=>!S.applied.includes(j.co+j.r)&&!(j.c==='gov'&&S.week>GOV_DEADLINE));
  const fit=shuffle(avail.filter(j=>fitOf(j)>=0&&!gate(j)));
  const chosen=[];
  for(const j of fit){if(chosen.length>=4)break;chosen.push(j)}
  for(const j of shuffle(avail)){if(chosen.length>=6)break;if(!chosen.includes(j))chosen.push(j)}
  S.board=shuffle(chosen).map(j=>({...j,uid:S.uid++,sal:ri(j.s[0],j.s[1]),crowd:ri(800,30000)}));
}

/* ========== 操作 ========== */
const ACTS=[
 {k:'study',n:'刷题复习',c:2,d:'专业能力提升，越高越难涨'},
 {k:'mock',n:'模拟面试',c:2,d:'面试表达提升，越高越难涨'},
 {k:'proj',n:'补实习/项目',c:3,d:'实习经历提升，越高越难涨'},
 {k:'ref',n:'找学长内推',c:2,d:'55% 拿到内推码'},
 {k:'rest',n:'躺平一下',c:1,d:'心态 +8'}
];
const grow=(x,a,b)=>Math.max(1,Math.round(ri(a,b)*(1-x/110)));
function doAct(k){
  const a=ACTS.find(x=>x.k===k),s=S.st;if(S.energy<a.c)return;
  S.energy-=a.c;let v;
  if(k==='study'){v=grow(s.skill,4,7);s.skill+=v;s.san-=2;addLog(`刷了一晚上题，专业能力 +${v}。`,'')}
  if(k==='mock'){v=grow(s.speak,4,7);s.speak+=v;s.san-=1;addLog(`对着镜子练自我介绍，面试表达 +${v}。`,'')}
  if(k==='proj'){v=grow(s.intern,6,10);s.intern+=v;s.san-=3;addLog(`接了个远程实习项目，实习经历 +${v}。`,'')}
  if(k==='ref'){if(R()<.55){s.refs++;addLog('学长回复了，拿到一个内推码。','good')}else addLog('给三位学长发了消息，都显示"已读"。','warn')}
  if(k==='rest'){s.san+=8;addLog('关掉招聘软件，睡了个午觉。心态 +8。','good')}
  norm(s);render();
}
function apply(uid,ref){
  const j=S.board.find(x=>x.uid===uid);if(!j||S.energy<1)return;if(ref&&S.st.refs<1)return;
  S.energy--;if(ref)S.st.refs--;
  S.board=S.board.filter(x=>x.uid!==uid);S.applied.push(j.co+j.r);
  S.apps.unshift({id:S.uid++,job:j,stages:STG[j.c].map(([t,n,w])=>({t,n,w:w||1})),si:0,wait:1,st:'active',ref,sal:j.sal,note:''});
  S.cnt.apply++;
  addLog(`${ref?'内推':'投递'}：${j.co} · ${j.r}`,'');
  render();
}
function addLog(t,tone){S.log.unshift({w:S.week,t,tone});if(S.log.length>80)S.log.pop()}

/* ========== 周结算 ========== */
function poolKey(a,stage){return stage.t==='interview'?a.job.k:stage.t}
function drawQ(key){
  const pool=Q[key];S.used[key]=S.used[key]||[];
  if(S.used[key].length>=pool.length)S.used[key]=[];
  const left=pool.map((_,i)=>i).filter(i=>!S.used[key].includes(i));
  const i=pick(left);S.used[key].push(i);return pool[i];
}
async function endWeek(){
  if(busy)return;busy=true;
  const lines=[];const s=S.st;
  for(const a of S.apps){if(a.st==='active')a.wait--}
  const due=S.apps.filter(a=>a.st==='active'&&a.wait<=0);
  for(const a of due){
    const stage=a.stages[a.si];let delta=0,mul=1;
    if(INTERACTIVE.has(stage.t)){const r=await ask(a,stage,drawQ(poolKey(a,stage)));delta=r.delta;mul=r.mul;s.buff=0}
    resolve(a,stage,delta,mul,lines);
  }
  // 随机事件
  let ev=null;
  if(R()<.7){const pool=EVENTS.filter(e=>!e.c||e.c(S));ev=pick(pool);ev.f(S);addLog(ev.t,ev.tone)}
  s.san-=2;norm(s);
  const over=s.san<=0;
  S.week++;
  if(!over&&S.week<=TOTAL_WEEKS){S.energy=Math.max(1,s.maxE-s.pen);s.pen=0;newBoard()}
  await report(lines,ev,over);
  if(over){S.dead=true;finalize()}
  else if(S.week>TOTAL_WEEKS)finalize();
  busy=false;render();
}
function resolve(a,stage,delta,mul,lines){
  const s=S.st,nm=`${a.job.co} · ${a.job.r}`;
  const pass=stageOutcome(a,stage.t,delta);
  if(stage.t==='hr')a.sal=Math.round(a.sal*mul);
  if(pass){
    a.si++;
    if(a.si>=a.stages.length){a.st='offer';a.note=`年包约 ${a.sal} 万`;S.cnt.offer++;s.san+=18;lines.push([`OFFER！${nm}，年包约 ${a.sal} 万`,'good']);addLog(`拿到 offer：${nm}`,'good')}
    else{const nx=a.stages[a.si];a.wait=nx.w;lines.push([`${nm}：${stage.n}通过，进入「${nx.n}」`,'good']);s.san+=2}
  }else{
    const why=gate(a.job);
    if(stage.t==='resume'){a.st='rej';a.note=why?`系统自动筛除（${why}）`:pick(FAIL.resume);S.cnt.resume++;s.san-=2}
    else if(stage.t==='written'){a.st='rej';a.note=pick(FAIL.written);S.cnt.written++;s.san-=3}
    else if(stage.t==='check'){a.st='rej';a.note=pick(FAIL.check);S.cnt.inter++;s.san-=8}
    else if(R()<.3){a.st='pool';a.note=`${stage.n}后进了人才池，泡着`;S.cnt.pool++;s.san-=3}
    else{a.st='rej';a.note=pick(FAIL.inter);S.cnt.inter++;s.san-=6}
    a.failAt=a.si;
    lines.push([`${nm}：${a.st==='pool'?'泡池子':stage.n+'挂了'}`,a.st==='pool'?'warn':'bad']);
    addLog(`${nm}：${a.note}`,a.st==='pool'?'warn':'bad');
  }
  norm(s);
}
function finalize(){
  for(const a of S.apps){
    if(a.st==='active'){a.st='ghost';a.note=`秋招结束，流程停在「${a.stages[a.si].n}」，再无音讯`}
    else if(a.st==='pool'&&!S.dead){if(R()<.3){a.st='offer';a.note=`被从人才池捞起！年包约 ${a.sal} 万`;S.cnt.offer++}else{a.note='在池子里泡到了冬天'}}
  }
  S.phase='end';
}

/* ========== 弹窗 ========== */
function openDlg(html){$('#dlg').innerHTML=html;$('#ov').hidden=false;const b=$('#dlg').querySelector('button');if(b)b.focus()}
function closeDlg(){$('#ov').hidden=true;$('#dlg').innerHTML=''}
function ask(a,stage,q){
  return new Promise(res=>{
    const [text,opts]=q;const order=shuffle(opts);
    const asker=stage.t==='hr'?'HR':stage.t==='boss'?'老板':stage.t==='struct'?'主考官':stage.t==='lecture'?'评委':'面试官';
    openDlg(`<div class="dh"><h3>${esc(stage.n)}</h3><span class="stamp" style="font-size:16px">${esc(a.job.co)}</span></div>
      <div class="db"><div class="muted" style="font-size:13px">${esc(a.job.r)} · 第 ${S.week} 周</div>
      <div class="q"><span class="who2">${asker}</span>${esc(text)}</div>
      <div class="opts">${order.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[0])}</button>`).join('')}</div>
      <div id="fbx"></div></div>`);
    $('#dlg').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=order[+b.dataset.i];
      const d=Array.isArray(o[1])?ri(o[1][0],o[1][1]):o[1];
      $('#dlg').querySelectorAll('.opt').forEach(x=>{x.disabled=true});b.classList.add('picked');
      $('#fbx').innerHTML=`<div class="fb ${d>=8?'good':d<=-5?'bad':''}">${esc(o[2])}</div><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn" id="cont">等结果 →</button></div>`;
      $('#cont').focus();
      $('#cont').onclick=()=>{closeDlg();res({delta:d,mul:o[3]||1})};

  });
}
function report(lines,ev,over){
  return new Promise(res=>{
    const last=S.week>TOTAL_WEEKS;
    openDlg(`<div class="dh"><h3>第 ${S.week-1} 周结算</h3><span class="mono muted">${weekDate(S.week-1)}</span></div>
      <div class="db">
        ${lines.length?`<div class="rep">${lines.map(([t,c])=>`<div class="${c}">${esc(t)}</div>`).join('')}</div>`:'<div class="muted">这周没有任何流程出结果。HR 们大概都在开会。</div>'}
        ${ev?`<div class="evt"><b>本周插曲</b>${esc(ev.t)}</div>`:''}
        ${over?'<div class="fb bad">心态归零。你关掉了所有招聘软件。</div>':last?'<div class="fb">秋招季结束了。看看你手里有什么。</div>':''}
      </div>
      <div class="df"><button class="btn" id="nx">${over||last?'查看结局':'进入第 '+S.week+' 周 →'}</button></div>`);
    $('#nx').onclick=()=>{closeDlg();res()};
  });
}

function appItem(a){
  const dead=['rej','ghost','frozen'].includes(a.st)||(a.st==='pool'&&S.phase==='end');

    let c='';if(a.st==='offer'||i<a.si)c='done';else if(i===a.si)c=a.st==='active'?'cur':(a.st==='pool'||a.st==='ghost')?'cur':'fail';

  else if(a.st==='rej')right='<span class="stamp">已挂</span>';
  else if(a.st==='pool')right='<span class="stamp amber">泡池</span>';
  else if(a.st==='frozen')right='<span class="stamp grey">冻结</span>';
  else if(a.st==='ghost')right='<span class="stamp grey">无音讯</span>';
  else{const s=a.stages[a.si];note=`${INTERACTIVE.has(s.t)?(a.wait<=1?'本周末'+s.n:a.wait+' 周后'+s.n):(a.wait<=1?'本周末出结果':a.wait+' 周后出结果')}${a.ref?' · 内推':''}`}
  return `<div class="appi ${dead?'dead':''}"><div class="hd"><div class="nm">${esc(a.job.co)} <small>· ${esc(a.job.r)}</small></div>${right}</div>
    <div class="pipe">${pipe}</div><div class="note">${esc(note)}</div></div>`;
}
function renderPlay(){
  const s=S.st,id=S.id;
  const live=S.apps.filter(a=>['active','offer','pool'].includes(a.st)),dead=S.apps.filter(a=>!['active','offer','pool'].includes(a.st));
  live.sort((x,y)=>(x.st==='offer'?0:x.st==='active'?1:2)-(y.st==='offer'?0:y.st==='active'?1:2));
  return `${masthead()}
  <section class="sheet">
    <div class="top"><div class="who">${idLine(id)}</div>
      <div class="week"><div class="mono big">第 ${S.week} / ${TOTAL_WEEKS} 周</div><div class="muted mono" style="font-size:12px">${weekDate(S.week)}</div><div class="prog"><i style="width:${(S.week-1)/TOTAL_WEEKS*100}%"></i></div></div></div>
    <div class="statgrid" style="border-top:1px solid var(--rule)">${meter('心态',s.san,'san')}${meter('专业能力',s.skill)}${meter('面试表达',s.speak)}${meter('实习经历',s.intern)}
      <div class="meter"><div class="lab"><span>精力</span><b>${S.energy}/${s.maxE}</b></div><div class="energy">${Array.from({length:Math.max(s.maxE,S.energy)},(_,i)=>`<i class="${i<S.energy?'on':''}"></i>`).join('')}</div></div>
      <div class="meter"><div class="lab"><span>内推码</span><b>${s.refs}</b></div><div class="muted" style="font-size:11.5px">内推投递简历分 +12</div></div>
    </div>
    <div class="actions">${ACTS.map(a=>`<button class="act" data-a="act" data-k="${a.k}" ${S.energy<a.c?'disabled':''}><b>${a.n} <span class="mono">−${a.c}</span></b><span>${a.d}</span></button>`).join('')}</div>
  </section>
  <div class="cols">
    <section class="sheet panel"><h2>本周岗位 <small>投递一次耗 1 点精力</small></h2>
      ${S.board.length?S.board.map(jobCard).join(''):'<div class="empty">这周的岗位都投完了。下周会刷新。</div>'}</section>
    <section class="sheet panel"><h2>我的投递 <small class="mono">${S.cnt.apply} 份 · ${S.cnt.offer} offer</small></h2>
      ${live.length?live.map(appItem).join(''):'<div class="empty">还没投简历。左边挑几个岗位试试。</div>'}
      ${dead.length?`<button class="fold" data-a="fold">${showDead?'收起':'展开'}已结束的 ${dead.length} 个流程</button>${showDead?dead.map(appItem).join(''):''}`:''}
    </section>
  </div>
  <section class="sheet panel"><h2>求职日志</h2><div class="log">${S.log.map(l=>`<div><span class="w">W${l.w}</span><span class="${l.tone}">${esc(l.t)}</span></div>`).join('')}</div></section>
  <div class="dock"><div class="in"><span class="muted" style="font-size:13px">还剩 <b class="mono" style="color:var(--ink)">${S.energy}</b> 点精力${S.energy>0?'，用完再结束也行':''}</span>
    <button class="btn" data-a="end">结束本周 →</button></div></div>`;
}

const FLAVOR={bigtech:'工牌到手，福报开始。',foreign:'Work-life balance，至少合同上写着。',soe:'五险二金，食堂很香。',bank:'先从柜台干起，存款指标已经在路上了。',
  finance:'西装买好了，凌晨两点的 PPT 也在等你。',gov:'上岸了。家族群开始转发。',edu:'寒暑假是真的，家长群也是真的。',academic:'非升即走，倒计时开始。',
  startup:'期权很多，工资准不准时看下一轮融资。',consult:'航空公司金卡办好了，睡眠另说。',other:'也是一份正经工作。'};
function grade(sal){return sal>=40?'SSP':sal>=25?'SP':sal>=15?'普通 offer':'保底 offer'}
function shareText(res){
  const id=S.id,c=S.cnt;
  return `我在「秋招求生记」抽到【${id.school}·${id.major.n}·${id.deg.k}】，投了 ${c.apply} 份简历：简历挂 ${c.resume}、笔试挂 ${c.written}、面试挂 ${c.inter}、泡池子 ${c.pool}。最后${res}。你也来抽一个？`;
}
function renderEnd(){
  const offers=S.apps.filter(a=>a.st==='offer').sort((x,y)=>y.sal-x.sal);const c=S.cnt;
  const tally=`<div class="tally"><div><span>投递</span><b>${c.apply}</b></div><div><span>简历挂</span><b>${c.resume}</b></div><div><span>笔试挂</span><b>${c.written}</b></div>
    <div><span>面试挂</span><b>${c.inter}</b></div><div><span>泡池子</span><b>${c.pool}</b></div><div><span>OFFER</span><b>${offers.length}</b></div></div>`;
  let body;
  if(S.dead){
    body=`<span class="stamp grey in">暂停求职</span><h1>第 ${S.week-1} 周，心态崩了</h1>
      <p>你关掉了招聘软件，打开了考公网课。${offers.length?`手里其实还有 ${offers.length} 个 offer，但你已经不想看了。`:''}</p>${tally}
      <div class="share" id="sh">${esc(shareText('心态崩了，回家考公'))}</div>`;
  }else if(offers.length&&!S.signed){
    body=`<span class="stamp green in">秋招结束</span><h1>你有 ${offers.length} 个 offer，选一家签三方</h1>${tally}
      <div class="offerlist">${offers.map(a=>`<div class="offerrow"><div><b>${esc(a.job.co)}</b> · ${esc(a.job.r)}<div class="muted" style="font-size:13px">${CAT[a.job.c]} · 年包约 <span class="mono">${a.sal}</span> 万 · ${grade(a.sal)}</div></div>
        <button class="btn small" data-a="sign" data-i="${a.id}">签这家</button></div>`).join('')}</div>`;
  }else if(S.signed){
    const a=S.signed;
    const res=`签了${a.job.co}的${a.job.r}，年包约 ${a.sal} 万`;
    body=`<span class="stamp in">已签三方</span><h1>${esc(a.job.co)}<br>${esc(a.job.r)}</h1>
      <p><span class="chip blue">${CAT[a.job.c]}</span> <span class="chip ${a.sal>=25?'green':''}">${grade(a.sal)}</span> <span class="mono">年包约 ${a.sal} 万</span></p>
      <p>${FLAVOR[a.job.c]}</p>${tally}<div class="share" id="sh">${esc(shareText(res))}</div>`;
  }else{
    const gov=S.apps.some(a=>a.job.c==='gov');
    const t=gov?'考公大军，明年见':pick(['春招再战','先去考个研','灵活就业，自由职业者']);
    body=`<span class="stamp in">0 OFFER</span><h1>${t}</h1>
      <p>秋招结束，手里没有 offer。${S.id.tier.halo>=80?'学校名气没能救你，这届真的难。':'这不是你一个人的问题。'}春招还有机会。</p>${tally}
      <div class="share" id="sh">${esc(shareText('0 offer，'+t))}</div>`;
  }
  const done=S.dead||S.signed||!offers.length;
  return `${masthead()}<section class="sheet ending">${body}
    ${done?`<div class="row-btns"><button class="btn" data-a="copy" id="cpy">复制战绩</button><button class="btn ghost" data-a="again">同一身份再来</button><button class="btn ghost" data-a="new">重新抽身份</button></div>`:''}
  </section>
  <section class="sheet panel"><h2>全部投递记录</h2>${S.apps.map(appItem).join('')||'<div class="empty">一份都没投。</div>'}</section>`;
}
function render(){
  const app=$('#app');
  app.innerHTML=S.phase==='roll'?renderRoll():S.phase==='play'?renderPlay():renderEnd();
}

/* ========== 抽签动画 ========== */
function animateRoll(){
  rolling=true;
  const id=rollIdentity();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pools=[DEGS.map(d=>d.k),TIERS.flatMap(t=>t.names),MAJORS.map(m=>m.n),TRAITS.map(t=>t.k)];
  if(reduce){S.id=id;rolling=false;render();return}
  const els=[0,1,2,3].map(i=>$('#f'+i));
  const btn=$('#rollbtn');if(btn)btn.disabled=true;
  els.forEach((el,i)=>{
    const iv=setInterval(()=>{el.textContent=pick(pools[i])},55);
    setTimeout(()=>{clearInterval(iv);if(i===3){S.id=id;rolling=false;render()}else{el.textContent=[id.deg.k,id.school,id.major.n][i];el.style.color='var(--accent)'}},500+i*380);
  });
}

/* ========== 事件绑定 ========== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled||busy&&b.dataset.a!=='copy')return;
  const a=b.dataset.a;
  if(a==='roll'&&!rolling)animateRoll();
  else if(a==='reroll'&&S.rerolls>0&&!rolling){S.rerolls--;S.id=null;_preview=null;render();animateRoll()}
  else if(a==='start')startGame(true);
  else if(a==='act')doAct(b.dataset.k);
  else if(a==='apply')apply(+b.dataset.u,false);
  else if(a==='ref')apply(+b.dataset.u,true);
  else if(a==='end')endWeek();
  else if(a==='fold'){showDead=!showDead;render()}
  else if(a==='sign'){S.signed=S.apps.find(x=>x.id===+b.dataset.i);render()}
  else if(a==='again'){S={phase:'roll',id:S.id,rerolls:S.rerolls,init:S.init};startGame(true)}
  else if(a==='new'){S={phase:'roll',id:null,rerolls:2};_preview=null;showDead=false;render();window.scrollTo(0,0)}
  else if(a==='copy'){
    const t=$('#sh').textContent;
    const ok=()=>{b.textContent='已复制'};
    const fail=()=>{const r=document.createRange();r.selectNodeContents($('#sh'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent='已选中，按 ⌘C / Ctrl+C 复制'};
    try{navigator.clipboard.writeText(t).then(ok,fail)}catch(_){fail()}
  }
});

/* ========== 启动 ========== */
function boot(d){
  if(d&&d.S&&d.S.phase){S=d.S;if(S.phase==='play'&&busy)busy=false}
  render();
}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(_){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
</body>
