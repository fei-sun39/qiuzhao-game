<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>秋招求生记</title>
<meta name="description" content="抽一个学历、学校、专业，熬过简历海投、面试修罗场和 HR 博弈，看你最后是什么秋招身份。">
<meta property="og:title" content="秋招求生记">
<meta property="og:description" content="抽身份、海投、面试、谈薪，12 周秋招模拟器。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&family=Rubik:wght@500;700;800&display=swap">
<style>
/* 布局：游戏 HUD（章节进度 + 四条属性）在上；行动按钮一行；岗位 | 流程 双栏；底部固定"结束本周"。
   视觉：粗描边 + 错位投影的卡通游戏卡片，天蓝底点阵，印章保留为身份元素。 */
:root{
  --bg:#e6efff; --dot:#cbdcff; --card:#ffffff; --soft:#f1f5fe; --ink:#1c2042; --muted:#5d6488;
  --edge:#1c2042; --sh:#1c2042;
  --orange:#ff7a3d; --blue:#3b78ff; --mint:#12b386; --purple:#8a5cff; --yellow:#f3b21f; --red:#ff4659;
  --on:#1a1430;
  --f-display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Rubik","Noto Sans SC",system-ui,sans-serif;
  --f-stamp:"Ma Shan Zheng","Kaiti SC","STKaiti",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13162e; --dot:#1d2246; --card:#1f2347; --soft:#272c58; --ink:#eef0ff; --muted:#a3a9d2;
  --edge:#4b5199; --sh:#06071a;
  --orange:#ff8b55; --blue:#6f9cff; --mint:#33d2a2; --purple:#a98bff; --yellow:#ffca4d; --red:#ff6d7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13162e; --dot:#1d2246; --card:#1f2347; --soft:#272c58; --ink:#eef0ff; --muted:#a3a9d2;
  --edge:#4b5199; --sh:#06071a;
  --orange:#ff8b55; --blue:#6f9cff; --mint:#33d2a2; --purple:#a98bff; --yellow:#ffca4d; --red:#ff6d7c; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.card{background:var(--card);border:2.5px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--sh)}
.btn{border:2.5px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--sh);background:var(--orange);color:var(--on);padding:10px 18px;font-weight:700;transition:transform .08s,box-shadow .08s}
.btn:not(:disabled):hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
.btn:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.btn:disabled{opacity:.45}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.blue{background:var(--blue);color:#fff}
.btn.mint{background:var(--mint);color:var(--on)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--sh)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:1px 9px;border-radius:99px;border:1.5px solid var(--edge);background:var(--soft);white-space:nowrap}
.chip.red{background:var(--red);color:#fff;border-color:var(--edge)}
.chip.green{background:var(--mint);color:var(--on)}
.chip.amber{background:var(--yellow);color:var(--on)}
.chip.blue{background:var(--blue);color:#fff}
.chip.purple{background:var(--purple);color:#fff}

.stamp{font-family:var(--f-stamp);color:var(--red);border:3px double currentColor;border-radius:8px;padding:0 10px;display:inline-block;transform:rotate(-7deg);line-height:1.35;letter-spacing:.06em;white-space:nowrap;background:color-mix(in srgb,var(--card) 70%,transparent)}
.stamp.green{color:var(--mint)} .stamp.amber{color:var(--yellow)} .stamp.grey{color:var(--muted)} .stamp.blue{color:var(--blue)} .stamp.purple{color:var(--purple)}
.stamp.in{animation:stampIn .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampIn{from{transform:rotate(-7deg) scale(2);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}

/* 标题 */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:clamp(30px,6vw,46px);line-height:1;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.brand .logo{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border:2.5px solid var(--edge);border-radius:12px;background:var(--orange);color:var(--on);box-shadow:3px 3px 0 var(--sh);font-size:.7em;transform:rotate(-6deg)}
.brand small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:.2em;color:var(--muted);margin-top:6px}

/* HUD */
.hud{padding:14px 16px;display:grid;gap:12px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;min-width:0}
.who b{font-size:16px}
.weekbox{display:flex;align-items:center;gap:10px}
.weekbox .w{font-family:var(--f-num);font-weight:800;font-size:22px}
.weekbox .d{font-size:12px;color:var(--muted)}
.chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chapters div{border:2px solid var(--edge);border-radius:10px;padding:3px 8px;font-size:12px;background:var(--soft);color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chapters div b{font-family:var(--f-num)}
.chapters div.on{background:var(--yellow);color:var(--on);font-weight:700}
.chapters div.done{background:var(--card);color:var(--ink)}
.attrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px}
.attr{position:relative;display:grid;gap:4px;min-width:0}
.attr .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:500;gap:6px}
.attr .lab b{font-family:var(--f-num);font-size:16px}
.attr .lab small{color:var(--muted);font-weight:400}
.bar{height:14px;border:2px solid var(--edge);border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.3,1.15);background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.attr.low .bar{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 45%,transparent)}}
.float{position:absolute;right:0;top:-6px;font-family:var(--f-num);font-weight:800;font-size:15px;pointer-events:none;animation:floatUp 1.4s ease-out forwards}
.float.up{color:var(--mint)} .float.down{color:var(--red)}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.minis{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.minis b{color:var(--ink);font-family:var(--f-num)}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:13px;height:13px;border-radius:50%;border:2px solid var(--edge);background:var(--soft)}
.pips i.on{background:var(--orange)}

/* 行动 */
.acts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.act{border:2.5px solid var(--edge);border-radius:14px;background:var(--card);box-shadow:3px 3px 0 var(--sh);padding:9px 10px;text-align:left;display:grid;gap:2px;transition:transform .08s,box-shadow .08s;min-width:0}
.act b{font-size:14.5px;display:flex;justify-content:space-between;gap:4px}
.act b .pips i{width:9px;height:9px;border-width:1.5px;background:var(--orange)}
.act span{font-size:11.5px;color:var(--muted);line-height:1.35}
.act:not(:disabled):hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh);background:var(--soft)}
.act:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.act:disabled{opacity:.42}

/* 双栏 */
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px;border-bottom:2.5px solid var(--edge)}
.ph h2{font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.03em}
.ph small{font-size:12px;color:var(--muted)}
.ph.orange{background:var(--orange);color:var(--on)} .ph.orange small{color:var(--on)}
.ph.mint{background:var(--mint);color:var(--on)} .ph.mint small{color:var(--on)}
.job{padding:12px 16px;border-bottom:2px dashed color-mix(in srgb,var(--edge) 35%,transparent);display:grid;gap:7px;animation:rise .35s ease both}
.job:last-child{border-bottom:0}
@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.job .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job .co{font-weight:700;font-size:15.5px}
.job .role{color:var(--muted);font-size:13.5px}
.sal{font-family:var(--f-num);font-weight:800;font-size:19px;white-space:nowrap}
.sal small{font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.job .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.job .ft .muted{font-size:12px}
.odds{font-weight:700}
.odds.g{color:var(--mint)} .odds.b{color:var(--blue)} .odds.a{color:var(--yellow)} .odds.r{color:var(--red)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:22px 16px;color:var(--muted);font-size:14px}
.appi{padding:10px 16px;border-bottom:2px dashed color-mix(in srgb,var(--edge) 35%,transparent);display:grid;gap:5px}
.appi:last-child{border-bottom:0}
.appi .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.appi .nm{font-weight:500;font-size:14px;min-width:0}
.appi .nm small{color:var(--muted);font-weight:400}
.appi .stamp{font-size:15px}
.appi.dead{opacity:.6}
.pipe{display:flex;flex-wrap:wrap;gap:3px;font-size:11.5px}
.pipe span{padding:0 7px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--edge) 30%,transparent);color:var(--muted)}
.pipe span.done{background:var(--mint);color:var(--on);border-color:var(--edge)}
.pipe span.cur{background:var(--yellow);color:var(--on);border-color:var(--edge);font-weight:700}
.pipe span.fail{background:var(--red);color:#fff;border-color:var(--edge);text-decoration:line-through}
.note{font-size:12px;color:var(--muted)}
.fold{padding:9px 16px;font-size:13px;border:0;background:none;color:var(--blue);text-align:left;font-weight:500}
.offer{padding:12px 16px;border-bottom:2px dashed color-mix(in srgb,var(--edge) 35%,transparent);display:grid;gap:6px}
.offer:last-child{border-bottom:0}
.offer .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wlb{display:inline-flex;gap:3px;vertical-align:middle}
.wlb i{width:9px;height:9px;border-radius:2px;border:1.5px solid var(--edge);background:var(--soft)}
.wlb i.on{background:var(--red)}
.log{padding:10px 16px;display:grid;gap:4px;font-size:13px;max-height:220px;overflow:auto}
.log div{display:grid;grid-template-columns:40px 1fr;gap:8px}
.log .w{font-family:var(--f-num);color:var(--muted)}
.t-good{color:var(--mint)} .t-bad{color:var(--red)} .t-warn{color:var(--yellow)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2.5px solid var(--edge);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .btn{font-size:16px;padding:11px 24px;white-space:nowrap;flex:none}
.dock .info{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 登记表 */
.form{max-width:660px;width:100%;margin:0 auto;position:relative;overflow:hidden}
.form-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:var(--blue);color:#fff;border-bottom:2.5px solid var(--edge)}
.form-title{font-family:var(--f-display);font-size:24px;letter-spacing:.08em}
.frow{display:grid;grid-template-columns:96px 1fr;border-bottom:2px solid color-mix(in srgb,var(--edge) 25%,transparent)}
.frow label{padding:12px 14px;background:var(--soft);font-size:13px;color:var(--muted);letter-spacing:.2em;display:flex;align-items:center;border-right:2px solid color-mix(in srgb,var(--edge) 25%,transparent)}
.frow .cell{padding:10px 14px;font-size:20px;font-weight:700;min-height:54px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.frow .cell .sub{font-size:13px;font-weight:400;color:var(--muted)}
.form .seal{position:absolute;right:18px;top:64px;font-size:26px}
.form-stats{padding:14px 18px;border-bottom:2px solid color-mix(in srgb,var(--edge) 25%,transparent)}
.form-foot{padding:16px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.intro{max-width:660px;margin:0 auto;width:100%;display:grid;gap:10px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps4 div{padding:10px;border:2.5px solid var(--edge);border-radius:14px;background:var(--card);box-shadow:3px 3px 0 var(--sh);display:grid;gap:2px}
.steps4 b{font-family:var(--f-display);font-weight:400;font-size:16px}
.steps4 span{font-size:12px;color:var(--muted)}
.steps4 em{font-style:normal;font-family:var(--f-num);font-weight:800;color:var(--orange)}

/* 成就 */
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:grid;justify-items:center;gap:3px;width:76px;text-align:center}
.badge .seal2{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--edge);display:grid;place-items:center;font-family:var(--f-stamp);font-size:27px;color:#fff;background:var(--c);box-shadow:2px 2px 0 var(--sh);position:relative}
.badge .seal2::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.65)}
.badge span{font-size:11.5px;line-height:1.3}
.badge.locked .seal2{background:var(--soft);color:var(--muted);filter:grayscale(1)}
.badge.locked span{color:var(--muted)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:40;display:grid;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;background:var(--card);border:2.5px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--sh);animation:toastIn .45s cubic-bezier(.2,1.4,.4,1) both;max-width:300px}
.toast .seal2{width:40px;height:40px;font-size:20px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--f-stamp);color:#fff;background:var(--c);flex:none}
.toast small{display:block;font-size:11px;color:var(--muted)}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

/* 弹窗 */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#0b0d24 55%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.dialog{width:100%;max-width:560px;max-height:100%;overflow:auto;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:2.5px solid var(--edge);background:var(--soft)}
.dh .tag{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.dh h3{font-family:var(--f-display);font-weight:400;font-size:21px}
.db{padding:16px 18px;display:grid;gap:12px}
.speaker{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.bubble{position:relative;background:var(--soft);border:2px solid var(--edge);border-radius:14px;padding:10px 12px;font-size:16px;font-weight:500}
.bubble small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;letter-spacing:.1em;margin-bottom:2px}
.opts{display:grid;gap:8px}
.opt{border:2.5px solid var(--edge);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--sh);text-align:left;padding:10px 13px;font-size:14.5px;transition:transform .08s,box-shadow .08s,background .15s}
.opt:not(:disabled):hover{background:var(--yellow);color:var(--on);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
.opt:disabled{opacity:.5}
.opt.picked{background:var(--yellow);color:var(--on);opacity:1}
.opt .req{display:block;font-size:11.5px;color:var(--red);font-weight:500}
.fb{border:2px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:14px;background:var(--soft);animation:rise .3s ease both}
.fb.good{background:color-mix(in srgb,var(--mint) 22%,var(--card))}
.fb.bad{background:color-mix(in srgb,var(--red) 18%,var(--card))}
.fxs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.fxc{font-size:12px;font-weight:700;padding:0 8px;border-radius:99px;border:1.5px solid var(--edge)}
.fxc.up{background:var(--mint);color:var(--on)} .fxc.down{background:var(--red);color:#fff}
.df{padding:12px 18px;border-top:2px solid color-mix(in srgb,var(--edge) 25%,transparent);display:flex;justify-content:flex-end;gap:8px}
.rep{display:grid;gap:6px;font-size:14px}
.rep>div{display:flex;gap:8px;align-items:flex-start}
.rep>div::before{content:"";flex:none;width:10px;height:10px;margin-top:6px;border-radius:50%;border:1.5px solid var(--edge);background:var(--muted)}
.rep>.good::before{background:var(--mint)} .rep>.bad::before{background:var(--red)} .rep>.warn::before{background:var(--yellow)}
.rep .fxs{margin-top:4px}
.evt{border:2px dashed var(--edge);border-radius:12px;padding:10px 12px;font-size:14px}
.evt b{display:block;font-size:11.5px;letter-spacing:.15em;color:var(--muted)}
.chapter-card{text-align:center;padding:30px 22px 24px;display:grid;gap:10px;justify-items:center}
.chapter-card .no{font-family:var(--f-num);font-weight:800;font-size:14px;letter-spacing:.3em;color:var(--muted)}
.chapter-card h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,7vw,44px);line-height:1.1}
.chapter-card p{margin:0;color:var(--muted);max-width:30em}
.chapter-card .big{font-size:64px;line-height:1}

/* 终局 */
.destiny{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.dest{border:2.5px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--sh);padding:14px;text-align:left;display:grid;gap:6px;transition:transform .08s,box-shadow .08s}
.dest:not(:disabled):hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.dest:disabled{opacity:.55}
.dest .k{font-size:11.5px;letter-spacing:.15em;font-weight:700;color:var(--muted)}
.dest b{font-size:17px}
.dest .s{font-size:13px;color:var(--muted)}
.dest .req{font-size:12px;color:var(--red);font-weight:500}
.dest.offerd{background:color-mix(in srgb,var(--mint) 14%,var(--card))}
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.rcard{overflow:hidden;position:relative}
.rcard .top{background:var(--orange);color:var(--on);padding:18px 20px 16px;border-bottom:2.5px solid var(--edge);display:grid;gap:4px}
.rcard .top .k{font-size:12px;letter-spacing:.25em;font-weight:700}
.rcard .top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.5vw,38px);line-height:1.15}
.rcard .bd{padding:16px 20px;display:grid;gap:14px}
.rcard .ending{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rcard .ending .stamp{font-size:26px}
.rcard .desc{font-size:15px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);border:2.5px solid var(--edge);border-radius:14px;overflow:hidden}
.tri div{padding:8px 10px;display:grid;justify-items:center;border-right:2px solid var(--edge)}
.tri div:last-child{border-right:0}
.tri b{font-family:var(--f-num);font-weight:800;font-size:26px;line-height:1.1}
.tri span{font-size:12px;color:var(--muted)}
.rattrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.side{display:grid;gap:12px}
.preview{display:grid;gap:10px;justify-items:center;text-align:center}
.preview img{border:2.5px solid var(--edge);border-radius:12px;max-height:70vh}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

@media (max-width:860px){
  .acts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols,.result{grid-template-columns:1fr}
}
@media (max-width:560px){
  .attrs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chapters div span{display:none}
  .chapters div{justify-content:center}
  .acts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:70px 1fr}
  .frow label{letter-spacing:.05em}
  .frow .cell{font-size:17px}
  .form .seal{top:auto;bottom:74px;right:12px;font-size:20px}
  .steps4{grid-template-columns:repeat(2,1fr)}
  .dock .btn{padding:10px 16px}
  .tri b{font-size:22px}
}

/* ================= 判定 ================= */
function fitOf(job){const t=S.id.major.t;if(job.m.includes(t))return 10;if(job.m.includes('any'))return 0;return -28}
function gate(job){
  if(S.id.deg.r<job.d)return `要求${DEGNAME[job.d]}及以上`;
  if(job.minHalo&&S.id.tier.halo<job.minHalo)return '限定重点院校';
  return '';
}
function resumeP(job,ref){
  if(gate(job))return .02;
  const h=S.id.tier.halo;
  let sc=.5*h+.36*S.a.comp+[0,8,10][S.id.deg.r]+S.rb+fitOf(job)+(ref?12:0);
  if(S.id.deg.r===2&&job.d===0&&job.k!=='research')sc-=6;
  if(job.k==='research'&&S.paper)sc+=8;
  return clamp(sig((sc-job.bar-6)/6)+S.luck,.03,.92);
}
function pLabel(p){return p>=.7?['高','g']:p>=.4?['中','b']:p>=.15?['低','a']:['渺茫','r']}
function stageOutcome(a,type,delta){
  const h=S.id.tier.halo,job=a.job,eb=Math.max(job.bar,40),c=S.a.comp,cf=S.a.conf;let p;
  if(type==='resume')p=resumeP(job,a.ref);
  else if(type==='written'){const sc=.75*c+.12*h+(R()*24-12);p=.85*sig((sc-eb*.85-6)/6)}
  else if(type==='hr')p=.74+delta*.014+(cf-50)*.002;
  else if(type==='check')p=.95;
  else{const sc=.5*c+.16*cf+.08*h+delta+S.buff+(R()*16-8)-(cf<25?5:0);p=.8*sig((sc-eb*.88-7)/5)}
  p=clamp(p+(type==='resume'?0:S.luck),.02,.97);
  return R()<p;
}

function newBoard(){
  const avail=JOBS.filter(j=>!S.applied.includes(j.co+j.r)&&!(j.c==='gov'&&S.week>GOV_DEADLINE));
  const fit=shuffle(avail.filter(j=>fitOf(j)>=0&&!gate(j)));
  const chosen=[];
  for(const j of fit){if(chosen.length>=4)break;chosen.push(j)}
  for(const j of shuffle(avail)){if(chosen.length>=6)break;if(!chosen.includes(j))chosen.push(j)}
  S.board=shuffle(chosen).map(j=>({...j,uid:S.uid++,sal:ri(j.s[0],j.s[1]),crowd:ri(800,30000)}));
}
function mkApp(j,ref){
  return {id:S.uid++,job:j,stages:STG[j.c].map(([t,n,w])=>({t,n,w:w||1})),si:0,wait:1,st:'active',ref,sal:j.sal,note:''};
}
function apply(uid,ref){
  const j=S.board.find(x=>x.uid===uid);if(!j||S.energy<1||busy())return;if(ref&&S.refs<1)return;
  S.energy--;if(ref){S.refs--;S.cnt.refUsed++}
  S.board=S.board.filter(x=>x.uid!==uid);S.applied.push(j.co+j.r);
  S.apps.unshift(mkApp(j,ref));S.cnt.apply++;
  fx({mind:-1});
  addLog(`${ref?'内推':'投递'}：${j.co} · ${j.r}`,'');
  checkAch();save();render();
}

  q.push({t:'event'},{t:'week'});
  S.lines=[];S.ev=null;S.weekFx=[];S.queue=q;save();runQueue();
}
async function runQueue(){
  if(_running)return;_running=true;render();
  try{
    while(S.queue.length){const st=S.queue[0];await doStep(st);S.queue.shift();checkAch();save();render()}
  }finally{_running=false}
  render();
}
async function doStep(st){
  const a=st.id?S.apps.find(x=>x.id===st.id):null;
  if(st.t==='stage'){
    if(!a||a.st!=='active')return;
    const stage=a.stages[a.si];let delta=0,mul=1;
    if(INTERACTIVE.has(stage.t)){const r=await interview(a,stage);delta=r.delta;mul=r.mul;S.buff=0;S.cnt.interviews++}
    const got=resolve(a,stage,delta,mul);
    if(got)S.queue.splice(1,0,{t:'nego',id:a.id});
  }
  else if(st.t==='nego'){if(a&&a.st==='offer')await nego(a)}
  else if(st.t==='deadline'){if(a&&a.st==='offer'&&a.dl<=S.week)await deadline(a)}
  else if(st.t==='event')randomEvent();
  else if(st.t==='week')weekTick();
  else if(st.t==='report')await report();
  else if(st.t==='broke')await brokeChoice();
  else if(st.t==='chapter')await chapterCard(st.ch);
  else if(st.t==='story')await storyEvent();
  else if(st.t==='finish')finalize();
}
function resolve(a,stage,delta,mul){
  const nm=`${a.job.co} · ${a.job.r}`;
  _chips=[];
  const pass=stageOutcome(a,stage.t,delta);
  if(mul!==1)a.sal=Math.round(a.sal*mul);
  if(pass){
    a.si++;
    if(a.si>=a.stages.length){makeOffer(a);fx({conf:6,mind:8});S.lines.push([`OFFER！${nm}`,'good',_chips]);addLog(`拿到 offer：${nm}`,'good');celebrate();return true}
    const nx=a.stages[a.si];a.wait=nx.w;fx({conf:1});S.lines.push([`${nm}：${stage.n}通过 → ${nx.n}`,'good',_chips]);
  }else{
    const why=gate(a.job);a.failAt=a.si;
    if(stage.t==='resume'){a.st='rej';a.note=why?`系统自动筛除（${why}）`:pick(FAIL.resume);S.cnt.resume++;S.cnt.rej++;fx({conf:-1,mind:-1})}
    else if(stage.t==='written'){a.st='rej';a.note=pick(FAIL.written);S.cnt.written++;S.cnt.rej++;fx({conf:-2,mind:-2})}
    else if(stage.t==='check'){a.st='rej';a.note=pick(FAIL.check);S.cnt.inter++;S.cnt.rej++;fx({conf:-3,mind:-6})}
    else if(R()<.3){a.st='pool';a.note=`${stage.n}后进了人才池，泡着`;S.cnt.pool++;fx({conf:-2,mind:-1})}
    else{a.st='rej';a.note=pick(FAIL.inter);S.cnt.inter++;S.cnt.rej++;fx({conf:-5,mind:-4})}
    S.lines.push([`${nm}：${a.st==='pool'?'泡池子':stage.n+'挂了'}`,a.st==='pool'?'warn':'bad',_chips]);
    addLog(`${nm}：${a.note}`,a.st==='pool'?'warn':'bad');
  }
  return false;
}
function randomEvent(){
  if(R()>.75)return;
  let pool=EVENTS.filter(e=>!e.c||e.c());
  if(S.lastEvTone==='bad')pool=pool.filter(e=>e.tone!=='bad');
  if(S.a.mind<30)pool=pool.filter(e=>e.tone!=='bad'||R()<.5);
  if(!pool.length)return;
  const e=wpick(pool);_chips=[];e.f();
  S.ev={t:e.t,tone:e.tone,fx:_chips};S.lastEvTone=e.tone;addLog(e.t,e.tone==='good'?'good':e.tone==='bad'?'bad':'warn');
}
function weekTick(){
  _chips=[];
  // 海投结果
  if(S.massPending){
    const n=S.massPending;S.massPending=0;
    const rej=Math.round(n*(.2+R()*.15));S.cnt.rej+=rej;S.cnt.resume+=rej;
    let spawned=0;
    for(let i=0;i<n;i++){if(R()<.025){const pool=fitJobs().length?fitJobs():JOBS.filter(j=>!S.applied.includes(j.co+j.r));if(!pool.length)break;const j=pick(pool);const inst={...j,uid:S.uid++,sal:ri(j.s[0],j.s[1]),crowd:0};S.applied.push(j.co+j.r);const a=mkApp(inst,false);a.si=1;a.wait=a.stages[1].w;a.note='海投捞到的';S.apps.unshift(a);spawned++}}
    fx({mind:-Math.min(6,Math.ceil(rej/3))});
    S.lines.push([`海投的 ${n} 家：${rej} 封拒信，${n-rej-spawned} 家石沉大海${spawned?`，${spawned} 家通过了简历筛选！`:'。'}`,spawned?'good':'bad',_chips]);
    addLog(`海投结果：${rej} 封拒信，${spawned} 家进入笔试/面试。`,spawned?'good':'bad');
    _chips=[];
  }
  // 每周固定消耗
  const d={mind:-2,money:-3};if(S.a.money<20)d.mind-=2;if(S.a.conf<25)d.mind-=1;
  fx(d);S.weekFx=_chips;
  const over=S.a.mind<=0;
  const oldCh=chapterOf(S.week);
  S.week++;
  const rest=[{t:'report'}];
  if(over){S.dead=true;rest.push({t:'finish'})}
  else if(S.week>TOTAL_WEEKS)rest.push({t:'finish'});
  else{
    S.energy=Math.max(1,S.maxE-S.pen);S.pen=0;newBoard();
    if(S.a.money<=6)rest.push({t:'broke'});
    const ch=chapterOf(S.week);
    if(ch!==oldCh)rest.push({t:'chapter',ch});
    if(ch===1||R()<.6)rest.push({t:'story'});
  }
  S.queue.splice(1,0,...rest);
}

function drawQ(key){

}

/* ================= 成就检测 ================= */
function checkAch(atEnd){
  if(!S||S.phase==='roll')return;
  const g=store.get(ACH_KEY)||{};
  for(const x of ACH){
    if(S.achRun.includes(x.id))continue;
    if(x.end&&!atEnd&&S.phase!=='end')continue;
    if(x.end&&S.phase!=='end'&&S.phase!=='final')continue;
    let ok=false;try{ok=!!x.t()}catch(_){}
    if(ok){S.achRun.push(x.id);if(!g[x.id])g[x.id]=Date.now();toast(x)}
  }
  store.set(ACH_KEY,g);
}

function toastMsg(t){const box=$('#toasts');const el=document.createElement('div');el.className='toast';el.innerHTML=`<div style="padding:4px 6px">${esc(t)}</div>`;box.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},2600)}

function jobCard(j){

function wlbHTML(n){return `<span class="wlb" title="加班强度">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`}
function offerCard(a){
  const signed=a.st==='signed',other=S.apps.find(x=>x.st==='signed'&&x!==a);
  return `<div class="offer"><div class="hd"><div><b>${esc(a.job.co)}</b><div class="muted" style="font-size:13px">${esc(a.job.r)}</div></div><div class="sal">${a.sal}<small> 万/年</small></div></div>
    <div class="note">加班强度 ${wlbHTML(a.wlb)} · ${signed?'<b class="t-good">已签三方</b>':`第 <b class="num">${a.dl}</b> 周前答复`}</div>
    ${signed?'':`<div class="btns"><button class="btn sm mint" data-a="sign" data-i="${a.id}" ${busy()?'disabled':''}>${other?'毁约改签（−¥3,000）':'签三方'}</button><button class="btn sm alt" data-a="decline" data-i="${a.id}" ${busy()?'disabled':''}>婉拒</button></div>`}
  </div>`;
}
function appItem(a){
  const dead=['rej','ghost','frozen','expired','declined','rescinded'].includes(a.st)||(a.st==='pool'&&S.phase!=='play');
  const pipe=a.stages.map((s,i)=>{let c='';if(['offer','signed'].includes(a.st)||i<a.si)c='done';else if(i===a.si)c=['active','pool','ghost','frozen'].includes(a.st)?'cur':a.st==='rej'?'fail':'';return `<span class="${c}">${esc(s.n)}</span>`}).join('');
  const ST={offer:['OFFER','green'],signed:['已签约','green'],rej:['已挂',''],pool:['泡池','amber'],frozen:['取消','grey'],ghost:['无音讯','grey'],expired:['过期','grey'],declined:['已拒','grey'],rescinded:['被收回','']};
  let right='',note=a.note;
  if(ST[a.st])right=`<span class="stamp ${ST[a.st][1]}">${ST[a.st][0]}</span>`;
  else{const s=a.stages[a.si];note=`${a.wait<=1?'本周末':a.wait+' 周后'}${INTERACTIVE.has(s.t)?s.n:'出'+s.n+'结果'}${a.ref?' · 内推':''}${a.note?' · '+a.note:''}`}
  return `<div class="appi ${dead?'dead':''}"><div class="hd"><div class="nm">${esc(a.job.co)} <small>· ${esc(a.job.r)}</small></div>${right}</div><div class="pipe">${pipe}</div><div class="note">${esc(note)}</div></div>`;
}
let showDead=false;
function renderPlay(){
  const offers=validOffers();
  const live=S.apps.filter(a=>['active','pool'].includes(a.st)),dead=S.apps.filter(a=>!['active','pool','offer','signed'].includes(a.st));
  live.sort((x,y)=>(x.st==='active'?0:1)-(y.st==='active'?0:1));
  return `${masthead(`<button class="btn sm alt" data-a="quit">重新开始</button>`)}
  ${hudHTML()}
  <div class="acts">${ACTS.map(a=>`<button class="act" data-a="act" data-k="${a.k}" ${S.energy<a.c||busy()?'disabled':''}><b>${a.n}<span class="pips">${'<i></i>'.repeat(a.c)}</span></b><span>${a.d}</span></button>`).join('')}</div>
  <div class="cols">
    <section class="card panel"><div class="ph orange"><h2>本周岗位</h2><small>投递 1 点精力</small></div>
      ${S.board.length?S.board.map(jobCard).join(''):'<div class="empty">这周的岗位都投完了。下周会刷新。</div>'}</section>
    <div class="stack">
      ${offers.length?`<section class="card panel"><div class="ph mint"><h2>Offer 抽屉</h2><small>${offers.length} 个</small></div>${offers.map(offerCard).join('')}</section>`:''}
      <section class="card panel"><div class="ph"><h2>我的流程</h2><small class="num">${live.length} 个进行中</small></div>
        ${live.length?live.map(appItem).join(''):'<div class="empty">还没有进行中的流程。左边挑几个岗位投一投。</div>'}
        ${dead.length?`<button class="fold" data-a="fold">${showDead?'收起':'展开'}已结束的 ${dead.length} 个流程</button>${showDead?dead.map(appItem).join(''):''}`:''}
      </section>
      <section class="card panel"><div class="ph"><h2>求职日志</h2></div><div class="log">${S.log.slice(0,40).map(l=>`<div><span class="w">W${l.w}</span><span class="${l.tone?'t-'+l.tone:''}">${esc(l.t)}</span></div>`).join('')}</div></section>
    </div>
  </div>`;
}
function renderFinal(){
  const opts=destinyOptions();
  return `${masthead()}${hudHTML()}
  <section class="card" style="padding:18px;display:grid;gap:14px">
    <div><div class="muted" style="font-size:12px;letter-spacing:.2em;font-weight:700">第四章 · 最终命运</div><h2 style="font-family:var(--f-display);font-weight:400;font-size:28px">秋招结束了。选一条路。</h2>
    <div class="muted" style="font-size:14px">高薪和准点下班，你只能选一个。有些路线需要你在前面几章做过特定的选择才会解锁。</div></div>
    <div class="destiny">${opts.map((o,i)=>`<button class="dest ${o.type==='offer'?'offerd':''}" data-a="destiny" data-i="${i}" ${o.req?'disabled':''}><span class="k">${esc(o.k)}</span><b>${esc(o.title)}</b><span class="s">${esc(o.sub)}</span>${o.req?`<span class="req">${esc(o.req)}</span>`:''}</button>`).join('')}</div>
  </section>`;
}
function renderEnd(){
  const e=S.ending,[title,desc]=identity();
  return `${masthead()}
  <div class="result">
    <section class="card rcard" id="rcard">
      <div class="top"><span class="k">我的秋招身份</span><h1>${esc(title)}</h1><span style="font-size:14px;font-weight:500">${esc(S.id.school)} · ${esc(S.id.major.n)} · ${S.id.deg.k}</span></div>
      <div class="bd">
        <div class="ending"><div><div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.2em">最终命运</div><div style="font-family:var(--f-display);font-size:28px">${esc(e.name)}</div></div><span class="stamp in ${e.color==='green'?'green':e.color==='blue'?'blue':e.color==='purple'?'purple':e.color==='amber'?'amber':e.color==='grey'?'grey':''}">${esc(e.stamp)}</span></div>
        <div class="desc">${esc(desc)}</div>
        <div class="muted" style="font-size:14px">${esc(e.text)}</div>
        <div class="tri"><div><b>${S.cnt.apply}</b><span>投递</span></div><div><b>${S.cnt.interviews}</b><span>面试</span></div><div><b>${S.cnt.offer}</b><span>OFFER</span></div></div>
        <div class="rattrs">${Object.keys(AT).map(k=>attrHTML(k,S.a[k])).join('').replace(/id="a[tvb]-\w+"/g,'')}</div>
        <div><div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.2em;margin-bottom:8px">本局成就 ${S.achRun.length} / ${ACH.length}</div>${badgesHTML(S.achRun,false)}</div>

        <div class="btns"><button class="btn alt" data-a="again">同一身份再来</button><button class="btn alt" data-a="new">重新抽身份</button></div>

function renderDock(){
  const d=$('#dock');
  if(!S||S.phase!=='play'){d.innerHTML='';return}
  d.innerHTML=`<div class="dock"><div class="in"><div class="info"><span>精力 <span class="pips">${pipsHTML()}</span></span><span>第 ${S.week} 周 · ${CH[chapterOf(S.week)].t}</span></div>
    <button class="btn" data-a="end" ${busy()?'disabled':''}>${busy()?'处理中…':'结束本周 →'}</button></div></div>`;
}
function render(){
  const app=$('#app');if(!app)return;
  app.innerHTML=S.phase==='roll'?renderRoll():S.phase==='play'?renderPlay():S.phase==='final'?renderFinal():renderEnd();
  renderDock();
  if(_anim.length)requestAnimationFrame(flushAnim);
}
function save(){if(S&&S.phase!=='roll')store.set(SAVE_KEY,S);else store.del(SAVE_KEY)}

/* ================= 抽签 ================= */
let rolling=false;
function newRollState(rerolls=2){return{phase:'roll',id:null,init:null,rerolls,formNo:String(ri(10000,99999))}}
function animateRoll(){
  if(rolling)return;rolling=true;
  const id=rollIdentity();
  const finish=()=>{S.id=id;S.init=initStats(id);rolling=false;render()};
  if(reduceMotion()){finish();return}
  const pools=[DEGS.map(d=>d.k),TIERS.flatMap(t=>t.names),MAJORS.map(m=>m.n),TRAITS.map(t=>t.k)];
  const els=[0,1,2,3].map(i=>$('#f'+i));const btn=$('#rollbtn');if(btn)btn.disabled=true;
  els.forEach((el,i)=>{if(!el)return;const iv=setInterval(()=>{el.textContent=pick(pools[i])},55);
    setTimeout(()=>{clearInterval(iv);if(i===3)finish();else{el.textContent=[id.deg.k,id.school,id.major.n][i];el.style.color='var(--blue)'}},500+i*380)});
}
function startRun(id,init){
  S=freshRun(id,init);newBoard();
  addLog(`秋招开始。你是${id.school}${id.major.n}专业的${id.deg.k}应届生。`,'');
  S.queue=[{t:'chapter',ch:1},{t:'story'}];save();render();runQueue();
}

/* ================= 事件绑定 ================= */
let quitArm=0;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a==='roll')animateRoll();
  else if(a==='reroll'&&S.rerolls>0&&!rolling){S.rerolls--;S.id=null;S.init=null;render();animateRoll()}
  else if(a==='start'&&S.id)startRun(S.id,S.init);
  else if(a==='act')doAct(b.dataset.k);
  else if(a==='apply')apply(+b.dataset.u,false);
  else if(a==='ref')apply(+b.dataset.u,true);
  else if(a==='end')endWeek();
  else if(a==='fold'){showDead=!showDead;render()}
  else if(a==='sign'){const x=S.apps.find(y=>y.id===+b.dataset.i);if(x&&x.st==='offer'&&!busy()){signOffer(x);checkAch();save();render()}}
  else if(a==='decline'){const x=S.apps.find(y=>y.id===+b.dataset.i);if(x&&x.st==='offer'&&!busy()){declineOffer(x);save();render()}}
  else if(a==='destiny')chooseDestiny(+b.dataset.i);
  else if(a==='img')saveImage(b);
  else if(a==='share')shareResult(b);
  else if(a==='again'){const id=S.id,init=S.init;showDead=false;startRun(id,init);window.scrollTo(0,0)}
  else if(a==='new'){S=newRollState();showDead=false;save();render();window.scrollTo(0,0)}
  else if(a==='quit'){
    if(Date.now()-quitArm<3000){S=newRollState();showDead=false;closeDlg();save();render();window.scrollTo(0,0)}
    else{quitArm=Date.now();b.textContent='再点一次确认';setTimeout(()=>{if(b.isConnected)b.textContent='重新开始'},3000)}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#ov').hidden){const c=$('#cont')||$('#nx');if(c){e.preventDefault();c.click()}}});

/* ================= 启动 ================= */
function boot(d){
  const saved=(d&&d.S)||store.get(SAVE_KEY);
  if(saved&&saved.v===2&&saved.phase&&saved.phase!=='roll'&&saved.id){S=saved;render();if(S.queue&&S.queue.length)runQueue()}
  else{S=newRollState();render()}
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S}))}catch(_){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot(window.claude&&window.claude.hot&&window.claude.hot.data);
</script>
